<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英汉在线翻译器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <main class="container">
      <header class="top-bar">
        <div>
          <h1>英汉在线翻译器</h1>
          <p class="subtitle">英文 ⇄ 中文快速翻译</p>
        </div>
        <button id="themeBtn" class="icon-btn" type="button">🌙</button>
      </header>

      <div class="control-row">
        <div class="select-box">
          <label for="direction">翻译方向</label>
          <select id="direction">
            <option value="auto">自动识别</option>
            <option value="en-zh">英文 → 中文</option>
            <option value="zh-en">中文 → 英文</option>
          </select>
        </div>

        <button id="swapBtn" class="swap-btn" type="button">⇄</button>
      </div>

      <p id="directionTip" class="tip">当前：自动识别</p>

      <textarea id="inputText" placeholder="请输入要翻译的英文或中文"></textarea>

      <div class="stats">
        <span id="charCount">字符：0</span>
        <span id="wordCount">英文单词：0</span>
      </div>

      <div class="button-group">
        <button id="translateBtn" class="primary-btn" type="button">翻译</button>
        <button id="clearBtn" class="secondary-btn" type="button">清空</button>
      </div>

      <div id="loading" class="loading hidden">翻译中，请稍等...</div>

      <textarea id="outputText" placeholder="翻译结果" readonly></textarea>

      <div class="result-actions">
        <button id="copyBtn" type="button">复制结果</button>
        <button id="copyBothBtn" type="button">复制双语</button>
        <button id="speakInputBtn" type="button">朗读原文</button>
        <button id="speakOutputBtn" type="button">朗读译文</button>
        <button id="favoriteBtn" type="button">收藏</button>
      </div>

      <section id="wordCard" class="panel hidden">
        <h2>英文单词卡片</h2>
        <div id="wordInfo" class="word-info"></div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <h2>翻译历史</h2>
          <button id="clearHistoryBtn" type="button">清空历史</button>
        </div>
        <div id="historyList" class="record-list"></div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <h2>我的收藏</h2>
          <button id="clearFavoriteBtn" type="button">清空收藏</button>
        </div>
        <div id="favoriteList" class="record-list"></div>
      </section>

      <p id="message" class="message"></p>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
